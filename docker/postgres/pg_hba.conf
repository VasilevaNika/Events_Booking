# pg_hba.conf для PRIMARY (лабораторная №4)
#
# Подключается к серверу через -c hba_file=/etc/postgresql/pg_hba.conf,
# поэтому правила версионируются вместе с проектом, а не живут только
# внутри тома с данными.
#
# Первые правила повторяют то, что initdb и официальный образ postgres
# создают по умолчанию, — чтобы не сломать docker exec psql и подключения
# приложения. Новое только одно: строка для роли replicator.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

# Streaming replication: реплика забирает поток WAL по сети docker.
# Ключевое слово "all" в колонке DATABASE НЕ покрывает replication-подключения,
# поэтому без этой строки pg_basebackup и walreceiver получают отказ.
# samenet — только из подсети, в которой находится сам сервер.
host    replication     replicator      samenet                 scram-sha-256

# Обычные подключения (приложение, pgAdmin через проброшенный порт)
host    all             all             all                     scram-sha-256
